# Shared test suite. Push to main updates the README badge. Pages deploys after
# this workflow succeeds (workflow_run). VPS still calls this via workflow_call
# on tags so a tag is not tested twice on main.
#
# PR / push: fast gate (frontend lint+unit+chromium e2e, server unit) ~1–3 min.
# Release (tags + workflow_call): also firefox/webkit + desktop e2e.
name: Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # npm 11 runs a registry audit after unpack; on GHA that often sits until a
  # ~5m timeout even with a warm package cache ("added N packages in 5m").
  npm_config_audit: "false"
  npm_config_fund: "false"

jobs:
  # -------------------------------------------------------------------------
  # Fast path: frontend only. Fail before server install / multi-browser e2e.
  # -------------------------------------------------------------------------
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend typecheck
        working-directory: frontend
        run: npx tsc -b --noEmit

      - name: Frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright Chromium
        working-directory: frontend
        # Browser binaries come from the cache above when warm; --with-deps is
        # still needed every run (apt libs are not in ~/.cache/ms-playwright).
        run: npx playwright install --with-deps chromium

      - name: Frontend e2e (Chromium + Vite + wasm)
        working-directory: frontend
        timeout-minutes: 10
        env:
          # One browser on the fast path; full matrix is job `e2e-full`.
          TILARI_E2E_BROWSERS: chromium
        run: npm run test:e2e

      - name: Upload Playwright output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-frontend-${{ github.run_id }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # -------------------------------------------------------------------------
  # Server unit/smoke — parallel with frontend (no Playwright, tiny tree).
  # -------------------------------------------------------------------------
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Server typecheck
        working-directory: server
        run: npm run typecheck

      - name: Server tests
        working-directory: server
        run: npm test

      - name: Server smoke (golden book via Ledger)
        working-directory: server
        run: npm run smoke

  # -------------------------------------------------------------------------
  # Release-tier: firefox + webkit + desktop (Node launcher). Tags / call / manual.
  # -------------------------------------------------------------------------
  e2e-full:
    if: >-
      github.event_name == 'workflow_call' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    needs:
      - frontend
      - server
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-full-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Frontend e2e (Chromium + Firefox + WebKit)
        working-directory: frontend
        timeout-minutes: 15
        run: npm run test:e2e

      - name: Desktop e2e (production UI + Node launcher)
        working-directory: frontend
        timeout-minutes: 10
        run: npm run test:desktop

      - name: Upload Playwright output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-full-${{ github.run_id }}
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
